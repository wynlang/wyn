name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wyn-linux-x64
          - os: ubuntu-24.04-arm
            artifact: wyn-linux-arm64
          - os: macos-15
            artifact: wyn-macos-arm64
          - os: macos-15-intel
            artifact: wyn-macos-x64
          - os: windows-latest
            artifact: wyn-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install make mingw -y
        shell: pwsh

      # Release binaries are built OPTIMIZED. The default `make` target uses
      # CFLAGS (which carry -g and no -O2 - correct for the dev loop), so every
      # release up to v1.20.0 shipped an unoptimized, unstripped compiler.
      # Measured on macOS arm64: 1,349,552 B default -> 933,952 B with -O2 ->
      # 871,592 B stripped, i.e. **35% smaller**. Warm compile time is
      # unchanged (0.15-0.16s either way), so this is a download-size win, not
      # a speed win - do not advertise it as the latter.
      # Override ONLY the optimization level, via OPT - do NOT pass CFLAGS= on the
      # command line. A command-line CFLAGS beats the Makefile's assignment
      # wholesale, so it silently dropped $(PLATFORM_CFLAGS), i.e.
      # -DWYN_PLATFORM_WINDOWS. Diffing the two Windows build lines from the v1.20.0
      # attempt, that plus -g -> -O2 were the ONLY differences:
      #   ci.yml   (works): -D_GNU_SOURCE -g   -DWYN_PLATFORM_WINDOWS -DWYN_VERSION=...
      #   release  (fails): -D_GNU_SOURCE -O2                         -DWYN_VERSION=...
      # and the failure was in mingw's own unistd.h, from the __CRT_INLINE body of
      # ftruncate calling _chsize:
      #   error: implicit declaration of function '_chsize' [-Wimplicit-function-declaration]
      # reported against src/package.c, src/lsp.c and src/bindgen.c. -O2 is what
      # makes those __CRT_INLINE bodies get emitted at all, which is why only the
      # optimized build tripped it, and gcc 14+ (the runner has mingw 16.1.0) makes
      # an implicit declaration a hard error rather than a warning.
      #
      # Both jobs use the SAME mingw 16.1.0, so the toolchain is not the variable -
      # the flags are. ci.yml runs a plain `make` and gets the auto-detected platform
      # flags; the release build was the only one replacing CFLAGS, so it was the
      # only one missing them.
      - name: Build compiler (optimized)
        run: |
          set -euo pipefail
          make clean
          # RELEASE_BUILD=1 drops the "-dev" suffix from `wyn version`. This is the
          # ONLY place it is set: every other build (local, CI, a user's `make`)
          # reports e.g. "v1.20.0-dev" so nobody mistakes a working tree for the
          # shipped compiler. If this flag is ever dropped the failure is a real
          # release labelled "-dev" - annoying but honest - rather than a dev build
          # masquerading as official.
          make RELEASE_BUILD=1 OPT=-O2
        shell: bash

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          echo 'fn main() -> int { println("Wyn release OK"); return 0 }' > /tmp/smoke.wyn
          ./wyn build /tmp/smoke.wyn
          /tmp/smoke | grep -q "OK"
          echo "✅ Release build verified"
        shell: bash

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          echo fn main() { println("Wyn release OK") } > smoke.wyn
          wyn.exe build smoke.wyn
          smoke.exe
        shell: cmd

      # Layout contract (install.sh depends on this - see the canary job):
      #   bin/wyn            the compiler
      #   src/wyn_runtime.h  runtime sources (bin/../src probe in main.c)
      #   runtime/libwyn_rt.a
      #   vendor/minicoro/
      #   VERSION
      #   LICENSE
      #   THIRD-PARTY-NOTICES.md  + vendor/*/COPYING (LGPL-2.1 for bundled TCC)
      # The old packaging had wyn at the tarball ROOT (install.sh expected
      # bin/), nested sources at src/src/ (cp -r src dist/src copies INTO an
      # existing dir), and no VERSION - so no released binary ever worked.
      #
      # LICENSE COMPLIANCE: the binary statically links LGPL-2.1 libtcc, so the
      # LGPL text and attribution MUST travel with every artifact. Shipping
      # MIT-only LICENSE next to a statically-linked LGPL library is a
      # distribution violation; the verify step below fails the release if the
      # notices are missing rather than letting it ship silently.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bin dist/runtime dist/vendor
          cp wyn dist/bin/
          # Strip debug symbols from the shipped compiler (-O2 build above is
          # 933,952 B; stripping takes it to 871,592 B on macOS arm64). Keep it
          # non-fatal: a strip failure must not fail a release, and the binary
          # is already correct without it.
          strip dist/bin/wyn || echo "note: strip unavailable or failed; shipping unstripped"
          ls -l dist/bin/wyn
          cp -r src dist/
          cp VERSION dist/
          cp LICENSE dist/
          cp THIRD-PARTY-NOTICES.md dist/
          [ -d vendor/minicoro ] && cp -r vendor/minicoro dist/vendor/
          # Bundle the TCC backend so the default (no-external-deps) compile
          # path works on a fresh install - the site advertises "TCC bundled".
          cp -r vendor/tcc dist/vendor/
          make runtime
          cp runtime/libwyn_rt.a dist/runtime/
          tar czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Verify artifact layout (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p /tmp/verify && tar xzf ${{ matrix.artifact }}.tar.gz -C /tmp/verify
          test -x /tmp/verify/bin/wyn
          test -f /tmp/verify/src/wyn_runtime.h
          test -f /tmp/verify/runtime/libwyn_rt.a
          test -f /tmp/verify/VERSION
          test -f /tmp/verify/LICENSE
          # LICENSE COMPLIANCE GATE: libtcc is statically linked and LGPL-2.1,
          # so its license text and attribution must ship with the artifact.
          # Fail the release rather than distribute without them.
          test -f /tmp/verify/THIRD-PARTY-NOTICES.md
          test -f /tmp/verify/vendor/tcc/COPYING
          # TCC must be bundled so "no external deps" is TRUE (site claim).
          test -x /tmp/verify/vendor/tcc/bin/tcc
          test -f /tmp/verify/vendor/tcc/lib/libwyn_rt_tcc.a
          # The INSTALLED binary must compile and run hello world from a
          # foreign cwd - this exact path was broken in every prior release.
          cd /tmp && echo 'fn main() { println("install-ok") }' > hello.wyn
          /tmp/verify/bin/wyn run hello.wyn | grep -q "install-ok"
          /tmp/verify/bin/wyn version | grep -vq "1.10.0"
          echo "✅ artifact layout + installed-binary smoke verified"

      # Windows must ship the SAME layout as Unix (install.ps1 depends on it):
      #   bin\wyn.exe, src\, runtime\libwyn_rt.a, vendor\, VERSION, LICENSE.
      # Build the runtime lib on Windows too (was missing - the installed
      # binary had no precompiled runtime and vendor was absent).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/bin dist/runtime dist/vendor
          cp wyn.exe dist/bin/
          cp -r src dist/
          cp VERSION dist/
          cp LICENSE dist/
          cp THIRD-PARTY-NOTICES.md dist/
          [ -d vendor/minicoro ] && cp -r vendor/minicoro dist/vendor/
          [ -d vendor/tcc ] && cp -r vendor/tcc dist/vendor/
          make runtime
          cp runtime/libwyn_rt.a dist/runtime/
          powershell -Command "Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip"
        shell: bash

      - name: Verify artifact layout (Windows)
        if: runner.os == 'Windows'
        run: |
          # Unzip into a cwd-relative dir. PowerShell's `/tmp` and git-bash's
          # `/tmp` map to DIFFERENT locations on the Windows runner, so a
          # PowerShell Expand-Archive to /tmp followed by a bash `test -f /tmp/...`
          # never sees the files (this failed the first release that ran it).
          # A relative "verify_out" dir is resolved identically by both.
          rm -rf verify_out
          powershell -Command "Expand-Archive -Path ${{ matrix.artifact }}.zip -DestinationPath verify_out -Force"
          test -f verify_out/bin/wyn.exe
          test -f verify_out/src/wyn_runtime.h
          test -f verify_out/runtime/libwyn_rt.a
          test -f verify_out/VERSION
          test -f verify_out/LICENSE
          # License-compliance gate (see the Unix job for rationale).
          test -f verify_out/THIRD-PARTY-NOTICES.md
          test -f verify_out/vendor/tcc/COPYING
          echo "artifact layout verified (Windows)"
        shell: bash

      # Emit the digest in the SAME job that produced the bytes, so the
      # install-canary below can verify exactly what a user would download.
      # (Generating sums only in the final release job would leave install.sh's
      # verification path completely unexercised by CI.)
      - name: Checksum artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.sha256
          fi
          cat ${{ matrix.artifact }}.sha256
        shell: bash

      - name: Checksum artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.sha256
          cat ${{ matrix.artifact }}.sha256
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # THE GATE: simulate the exact public `curl | sh` install flow against the
  # just-built artifacts on clean VMs. If a stranger couldn't install and run
  # hello world, the release does not happen. (Every prior release shipped
  # broken: asset-name mismatch vs install.sh, no bin/ layout, src/src/
  # nesting, missing VERSION - nothing exercised the public path.)
  install-canary:
    name: Install canary (${{ matrix.artifact }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wyn-linux-x64
          - os: ubuntu-24.04-arm
            artifact: wyn-linux-arm64
          - os: macos-15
            artifact: wyn-macos-arm64
          - os: macos-15-intel
            artifact: wyn-macos-x64
          - os: windows-latest
            artifact: wyn-windows-x64
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      # Exercise the integrity check install.sh performs, against the real
      # artifact, BEFORE trusting it - a verification path that CI never runs
      # is a verification path that silently rots.
      - name: Verify checksum like install.sh does (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ASSET=${{ matrix.artifact }}.tar.gz
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum "$ASSET" | cut -d' ' -f1)
          else
            ACTUAL=$(shasum -a 256 "$ASSET" | cut -d' ' -f1)
          fi
          EXPECTED=$(cut -d' ' -f1 < ${{ matrix.artifact }}.sha256)
          echo "expected=$EXPECTED"
          echo "actual=  $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "checksum mismatch"; exit 1; }
          # Negative control: a tampered byte MUST be detected. If this ever
          # stops failing, the check is vacuous.
          cp "$ASSET" /tmp/tampered.tar.gz
          printf 'x' >> /tmp/tampered.tar.gz
          if command -v sha256sum >/dev/null 2>&1; then
            BAD=$(sha256sum /tmp/tampered.tar.gz | cut -d' ' -f1)
          else
            BAD=$(shasum -a 256 /tmp/tampered.tar.gz | cut -d' ' -f1)
          fi
          [ "$BAD" != "$EXPECTED" ] || { echo "tamper NOT detected"; exit 1; }
          echo "✅ checksum verified and tamper-detection proven"

      - name: Install exactly like install.sh does (Unix)
        if: runner.os != 'Windows'
        run: |
          # Mirror site/public/install.sh: extract into ~/.wyn, run bin/wyn.
          INSTALL_DIR="$HOME/.wyn"
          mkdir -p "$INSTALL_DIR"
          tar xzf ${{ matrix.artifact }}.tar.gz -C "$INSTALL_DIR"
          chmod +x "$INSTALL_DIR/bin/wyn"
          export PATH="$INSTALL_DIR/bin:$PATH"
          # First-five-minutes flow, from a foreign cwd, like a real user.
          cd "$(mktemp -d)"
          wyn version
          wyn version | grep -vq "1.10.0"
          echo 'fn main() { println("hello from installed wyn") }' > hello.wyn
          wyn run hello.wyn | grep -q "hello from installed wyn"
          wyn new demo --template cli
          cd demo && wyn test
          echo "✅ public install flow verified on ${{ matrix.artifact }}"

      - name: Install exactly like install.ps1 does (Windows)
        if: runner.os == 'Windows'
        run: |
          # Mirror site/public/install.ps1: expand the zip into %USERPROFILE%\.wyn,
          # keep the bin\ subdir so wyn.exe finds ..\src and ..\runtime.
          $installDir = "$env:USERPROFILE\.wyn"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          Expand-Archive -Path "${{ matrix.artifact }}.zip" -DestinationPath $installDir -Force
          $env:PATH = "$installDir\bin;$env:PATH"
          # First-five-minutes flow, from a foreign cwd, like a real user.
          $work = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work
          wyn.exe version
          if ((wyn.exe version) -match "1\.10\.0") { throw "stale version" }
          'fn main() { println("hello from installed wyn") }' | Out-File -Encoding ascii hello.wyn
          $out = wyn.exe run hello.wyn
          if ($out -notmatch "hello from installed wyn") { throw "run failed: $out" }
          wyn.exe new demo --template cli
          Set-Location demo
          wyn.exe test
          Write-Host "public install flow verified on ${{ matrix.artifact }}"
        shell: pwsh

  release:
    name: Create Release
    needs: [build, install-canary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      # SUPPLY-CHAIN INTEGRITY: the public install path is `curl … | sh`, and
      # install.sh had no integrity check of any kind - it fetched from the
      # mutable `releases/latest/download/` pointer and piped straight into
      # tar. Publish SHA256SUMS alongside the artifacts so install.sh can
      # verify what it downloaded (it fails closed if the digest mismatches).
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          # download-artifact@v4 without a name puts each artifact in its own
          # directory; flatten them so the digest lines carry bare filenames
          # (what install.sh greps for after downloading a single asset).
          mkdir -p checksums
          for f in wyn-linux-x64/wyn-linux-x64.tar.gz \
                   wyn-linux-arm64/wyn-linux-arm64.tar.gz \
                   wyn-macos-arm64/wyn-macos-arm64.tar.gz \
                   wyn-macos-x64/wyn-macos-x64.tar.gz \
                   wyn-windows-x64/wyn-windows-x64.zip; do
            test -f "$f" || { echo "missing release asset: $f" >&2; exit 1; }
            cp "$f" checksums/
          done
          cd checksums
          sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > ../SHA256SUMS
          cd ..
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Self-check: the file must verify against the very artifacts we ship.
          (cd checksums && sha256sum -c ../SHA256SUMS)

      # RELEASE BODY = ONLY THIS VERSION'S SECTION.
      # This used to be `body_path: CHANGELOG.md`, which republished the entire
      # 1,000+ line file - all 24 historical releases - as the body of every
      # single release, including claims that later releases corrected. Extract
      # the one `## vX.Y.Z` section instead.
      #
      # SECURITY: github.ref_name is attacker-influencable in the general case
      # (a tag name is arbitrary text), so it is passed through `env:` and only
      # ever referenced as "$TAG" - never interpolated into the script body,
      # which would be a shell-injection sink.
      #
      # FAILS LOUDLY: no matching section, an empty section, or a tag that
      # disagrees with VERSION aborts the release. A silent fallback here would
      # just recreate the original bug (empty or full-history body).
      - name: Extract release notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "tag=$TAG version=$VERSION"

          # The tag must match the VERSION file - VERSION is the single source
          # of the version string the binary reports, so a mismatch means the
          # release would ship a binary that disagrees with its own tag.
          FILE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: tag '$TAG' does not match VERSION file ('$FILE_VERSION')." >&2
            echo "       Bump VERSION and re-tag; do not release a mismatched pair." >&2
            exit 1
          fi

          # Print from the `## v<version>` heading up to (not including) the next
          # `## ` heading. Headings in CHANGELOG.md come in two shapes -
          #   "## v1.20.0 (2026-07-28) - \"Title\""
          #   "## v1.18.0 - \"Title\" (2026-07-17)"
          # - so match on the second whitespace-separated field being exactly
          # "v<version>" rather than on the rest of the line.
          awk -v ver="$VERSION" '
            BEGIN { found = 0; printing = 0 }
            /^## / {
              if (printing) exit
              if ($2 == "v" ver) { found = 1; printing = 1; print; next }
              next
            }
            printing { print }
            END { if (!found) exit 3 }
          ' CHANGELOG.md > RELEASE_BODY.md || {
            echo "ERROR: no '## v$VERSION' section in CHANGELOG.md." >&2
            echo "       Add a section for this version before tagging." >&2
            exit 1
          }

          # A heading with nothing under it is as useless as no heading at all.
          if [ "$(grep -cve '^[[:space:]]*$' RELEASE_BODY.md)" -lt 2 ]; then
            echo "ERROR: the '## v$VERSION' section is empty." >&2
            exit 1
          fi

          printf '\n---\n\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> RELEASE_BODY.md

          echo "--- release body ($(wc -l < RELEASE_BODY.md) lines) ---"
          cat RELEASE_BODY.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wyn-linux-x64/wyn-linux-x64.tar.gz
            wyn-linux-arm64/wyn-linux-arm64.tar.gz
            wyn-macos-arm64/wyn-macos-arm64.tar.gz
            wyn-macos-x64/wyn-macos-x64.tar.gz
            wyn-windows-x64/wyn-windows-x64.zip
            SHA256SUMS
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
