name: CI

on:
  push:
    branches: [main, dev]
  # Gate PRs into BOTH branches. `dev` is the integration branch that ordinary
  # fix/feature PRs target; `main` represents the last release and only moves via
  # a dev -> main PR at release time. Without `dev` here, every integration PR
  # would land ungated and `main` would inherit whatever accumulated - which is
  # the same "a check that cannot fail reads as coverage" failure that let ~80
  # test files go ungated before v1.20.0.
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop only. Every individual test now has its own watchdog (perl alarm),
    # so this should never trigger; if it does, something escaped the watchdogs.
    # Without it a wedged suite burns the full 6h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # libsqlite3-dev: programs using `Db.` link against the system libsqlite3
        # (see src/main.c - it falls back to -lsqlite3 when ./packages/sqlite is
        # absent). macOS ships sqlite3.h in the SDK, so without this the 13
        # tests/stdlib files that use Db. failed to build on Linux ONLY, which is
        # exactly how it slipped through: the macOS jobs were green.
        run: sudo apt-get update && sudo apt-get install -y gcc make libsqlite3-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          for ($i = 0; $i -lt 3; $i++) {
            choco install make mingw -y --no-progress 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Retry $($i+1)/3..."
            Start-Sleep -Seconds 10
          }
          gcc --version
        shell: pwsh

      - name: Build compiler
        run: |
          # Remove macOS-only binaries that don't work on other platforms
          rm -f vendor/tcc/bin/tcc runtime/libwyn_rt.a runtime/libwyn_rt_tcc.a 2>/dev/null || true
          make clean && make
        shell: bash

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          echo 'fn main() -> int { println("Hello from Wyn CI"); return 0 }' > /tmp/smoke.wyn
          ./wyn build /tmp/smoke.wyn
          /tmp/smoke | grep -q "Hello from Wyn CI"
          echo "✅ Compiler builds and runs programs"

          echo 'test "math" { assert_eq(2 + 2, 4) }' > /tmp/smoke_test.wyn
          ./wyn build /tmp/smoke_test.wyn
          /tmp/smoke_test
          echo "✅ Test framework works"

          echo 'struct Point { x: int, y: int }
          fn main() -> int {
            var p = Point { x: 3, y: 4 }
            var s = "hello"
            println("${s} ${p.x},${p.y}")
            return 0
          }' > /tmp/smoke_adv.wyn
          ./wyn build /tmp/smoke_adv.wyn
          /tmp/smoke_adv | grep -q "hello 3,4"
          echo "✅ Structs, interpolation, var inference work"
        shell: bash

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          echo fn main() -^> int { println("Hello from Wyn CI"); return 0 } > smoke.wyn
          .\wyn.exe build smoke.wyn
          if exist smoke.exe ( .\smoke.exe ) else if exist smoke ( .\smoke ) else ( echo ERROR: binary not found && exit /b 1 )
        shell: cmd

      # THE FULL SUITE. `make test` is the only thing that drives tests/errors/
      # (40+ negative/behavioral gates), the golden-C snapshots, GPU, bindgen,
      # cpkg, sqlite, pkg, LSP and the fuzz smoke. CI used to run only
      # run_bdd.sh + run_tests_parallel.sh, so none of that was gated - which is
      # how tests/errors/run_channel_deadlock_test.sh shipped failing
      # deterministically at the v1.20.0 tag while the changelog claimed the
      # "full suite" was green. Never narrow this back to run_bdd.sh alone.
      #
      # `make test` already runs run_bdd.sh AND (new) the allowlist-gated stdlib
      # suite, so neither gets its own step here - that would just double-run
      # them. The only things still needing separate steps are the
      # coroutine-substrate rerun (same suite, different env) and the legacy
      # parallel runner.
      - name: Run full test suite - make test (Unix)
        if: runner.os != 'Windows'
        run: make test
        shell: bash

      # RESOURCE gate, not a behavior gate: a concurrent program that is merely
      # WAITING must not burn CPU. This cannot live in tests/regression/ because
      # the `// EXPECT:` runner only compares stdout, and it is exactly the kind
      # of regression that stays invisible in a functional suite - the scheduler
      # shipped for months with three spin sites that each burned ~a core (up to
      # 357% CPU on one) while every test passed.
      #
      # Measures cumulative child CPU via getrusage(RUSAGE_CHILDREN) /
      # GetProcessTimes (scripts/testing/cpu_probe.c) - never %CPU, which is a
      # decaying average and has produced wrong diagnoses on this codebase twice.
      # Budget raised 50 -> 80ms FOR CI ONLY (the local default stays 50ms, which
      # is what a dev machine should hold itself to). Rationale and the readings
      # are at the budget itself in scripts/integration_gates.sh, and the item is
      # tracked in internal-docs/ROADMAP.md under Tooling / DX.
      #
      # Short version: on the shared macos-15-intel runner, CPU-time accounting
      # also absorbs runqueue competition from co-tenants, so case (c) - the
      # awaited future_get path - read 25, 26, 96, then 79ms across runs whose code
      # differed only in docs and a shell script. It measures 12-20ms locally and
      # 31-43ms even throttled to 0.5 CPU, i.e. comfortably under budget on
      # genuinely slow hardware, so those spikes are contention and not cost.
      #
      # This does NOT weaken the gate's purpose. It exists to catch a spin that
      # burns a CORE: the bugs it was built for measured ~2000ms/2000ms and 357%
      # CPU. An 80ms ceiling still fails anything in that class by a factor of ~25,
      # while no longer failing the build on a noisy neighbour.
      - name: Idle-CPU gate - waiting programs must not spin (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/integration_gates.sh idle-cpu
        shell: bash
        env:
          WYN_IDLE_CPU_BUDGET_MS: 80

      - name: Run suite on the coroutine async substrate (W8, Unix)
        # WYN_ASYNC_CORO=1 runs awaited spawn/await_all/parallel as coroutines on
        # the M:N scheduler instead of the thread pool. The suite must be
        # behavior-identical on both substrates.
        if: runner.os != 'Windows'
        run: WYN_ASYNC_CORO=1 bash tests/run_bdd.sh
        shell: bash

      # NOTE: this runner reads tests/test_list.txt, which is NOT checked in, so
      # it currently reports "0 pass, 0 fail" and gates nothing. Kept because it
      # is harmless and becomes useful the moment the list is regenerated; do not
      # mistake its green tick for coverage. Real coverage is `make test` +
      # the stdlib step above.
      - name: Run legacy parallel runner (Unix, currently a no-op)
        if: runner.os != 'Windows'
        run: bash tests/run_tests_parallel.sh
        shell: bash

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: |
          ./wyn.exe build tests/smoke/wintest.wyn -o wintest
          ./wintest.exe
        shell: bash

      # ---------------------------------------------------------------------
      # Windows: `make test` as a whole CANNOT run here, so gate the portable
      # part of it explicitly instead of pretending the platform is covered.
      #
      # What is gated below (all host-independent):
      #   * golden-C snapshots      - codegen emits no host-conditional C
      #     (no _WIN32/__APPLE__ in src/codegen*.c or in any .c.golden), and the
      #     runner already normalizes the embedded source path and strips CR.
      #   * the check-only tests/errors/ suites - they only run `wyn check` and
      #     assert on diagnostic text, so no exec/signal/fork behavior is involved.
      #
      # What is NOT gated on Windows, and why (deliberate, not an oversight):
      #   * tests/errors/ suites that execute compiled binaries and assert on
      #     exit codes/signals (run_channel_deadlock, run_select_deadlock,
      #     run_map_missing_key, run_crucible_p0, ...). They depend on POSIX
      #     signal-to-exit-code mapping (rc 128+N) and on the perl-alarm
      #     watchdog killing a process group; both differ on Windows.
      #   * tests/pkg/*        - needs `git` + file:// remotes and symlinks.
      #   * tests/cpkg/*       - needs pkg-config / a Unix `cc -x c -` probe.
      #   * tests/gpu/*        - Metal/host-GPU probing.
      #   * tests/fuzz/*       - generator + POSIX watchdog.
      #   * tests/stdlib/*     - same watchdog/exit-code dependency.
      #   * run_bdd.sh         - same.
      # Bindgen, the FFI pipeline and LSP already have dedicated Windows steps
      # further down, which is why they are absent from this list.
      - name: Portable subset of make test (Windows)
        if: runner.os == 'Windows'
        run: |
          set -uo pipefail
          # Fail loudly if a prerequisite is missing rather than skipping quietly.
          command -v perl >/dev/null 2>&1 || { echo "perl not on PATH - cannot run the portable suite subset"; exit 1; }

          export WYN=./wyn.exe
          rc=0
          run_suite() {
            echo "=== $1 ==="
            # No pipe here: `bash "$1"` is the last command, so $? is its own
            # exit status (a pipeline would report the tail's status instead).
            if bash "$1"; then
              echo "--- PASS $1"
            else
              echo "--- FAIL $1 (rc=$?)"
              rc=1
            fi
          }

          run_suite tests/golden/run_golden_tests.sh
          run_suite tests/errors/run_removed_syntax_test.sh
          run_suite tests/errors/run_checker_soundness_test.sh
          run_suite tests/errors/run_cross_type_cmp_test.sh
          run_suite tests/errors/run_struct_eq_test.sh
          run_suite tests/errors/run_unterminated_string_test.sh
          run_suite tests/errors/run_empty_radix_literal_test.sh

          if [ "$rc" -ne 0 ]; then
            echo "Windows portable subset: FAILURES above"
            exit 1
          fi
          echo "Windows portable subset: all PASS"
        shell: bash

      # Bindgen shells out to `cc -E`; the Unix jobs cover it via `make test`, but
      # the Windows job doesn't run that suite, so exercise `wyn bind` explicitly
      # here to prove the C-header binding generator works on Windows too.
      - name: Bindgen smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          printf 'int add_one(int x);\ndouble half(double x);\nvoid* obj_new(int n);\n' > winhdr.h
          ./wyn.exe bind winhdr.h > winbind.wyn 2>bind_err.txt || (echo "wyn bind failed"; cat bind_err.txt; exit 1)
          cat winbind.wyn
          grep -q "extern fn add_one(a0: int) -> int;" winbind.wyn || (echo "MISSING add_one"; exit 1)
          grep -q "extern fn half(a0: float) -> float;" winbind.wyn || (echo "MISSING half"; exit 1)
          grep -q "extern fn obj_new(a0: int) -> ptr;" winbind.wyn || (echo "MISSING obj_new"; exit 1)
          echo "Windows bindgen smoke: PASS"
        shell: bash

      # Prove the whole FFI pipeline on Windows against a header/lib we fully
      # control (mingw's system math.h declares fns via CRT-inline/macro machinery
      # a naive scanner can't see - that's a bindgen-coverage matter, orthogonal to
      # the pipeline). This exercises bindgen -> extern fn -> [ffi] link -> build ->
      # run with a hand-written lib.
      - name: FFI pipeline smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          printf 'int triple(int x);\ndouble scale(double x, double f);\n' > mylib.h
          printf 'int triple(int x){return x*3;}\ndouble scale(double x,double f){return x*f;}\n' > mylib.c
          gcc -c mylib.c -o mylib.o && ar rcs libmylib.a mylib.o
          ./wyn.exe bind mylib.h > mybind.wyn 2>err.txt || (echo "bind failed"; cat err.txt; exit 1)
          cat mybind.wyn
          grep -q "extern fn triple(a0: int) -> int;" mybind.wyn || (echo "MISSING triple"; exit 1)
          grep -q "extern fn scale(a0: float, a1: float) -> float;" mybind.wyn || (echo "MISSING scale"; exit 1)
          printf '[project]\nname="t"\n[ffi]\nlibs="mylib"\nlib_dirs="."\n' > wyn.toml
          printf 'extern fn triple(a0: int) -> int;\nfn main() { println("${triple(9)}") }\n' > app.wyn
          ./wyn.exe build app.wyn
          if [ -f app.exe ]; then ./app.exe > got.txt; else ./app > got.txt; fi
          cat got.txt
          grep -q "27" got.txt || (echo "wrong result"; exit 1)
          echo "Windows FFI pipeline smoke: PASS"
        shell: bash

      # The LSP server shells out to `wyn check` and writes temp files - exactly
      # the path/shell-out surface that has broken on Windows before. The Windows
      # job doesn't run `make test`, so drive the LSP protocol test explicitly.
      - name: LSP smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          WYN=./wyn.exe python3 tests/lsp/lsp_client.py
        shell: bash

  # The RC/string/IO bugs live in the RUNTIME; every real UAF so far was
  # found by ASan-compiling the runtime and running programs against it -
  # but only when a human remembered to. This job makes it a gate.
  sanitize-runtime:
    name: ASan runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build compiler
        run: make clean && make
      - name: ASan runtime test set
        run: make asan-runtime-test

  # Data races hide in whichever executor a test doesn't exercise - the
  # coroutine scheduler (default) or the legacy thread pool (WYN_ASYNC_POOL=1).
  # The tsan-runtime-test target runs every concurrency test under BOTH.
  sanitize-runtime-tsan:
    name: TSan runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build compiler
        run: make clean && make
      - name: TSan runtime test set (both executors)
        run: make tsan-runtime-test

  cross-compile-ios:
    name: Cross-compile (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make clean && make
      - name: Cross-compile for iOS
        run: |
          echo 'fn main() -> int { return 0 }' > /tmp/ios.wyn
          ./wyn cross ios /tmp/ios.wyn
          file /tmp/ios.wyn.ios | grep -q "arm64"
          echo "✅ iOS cross-compilation works"
      - name: Cross-compile mobile-shim smoke app (counter-app shape)
        run: |
          cp tests/mobile/smoke_mobile_shim.wyn /tmp/shim.wyn
          ./wyn cross ios /tmp/shim.wyn
          file /tmp/shim.wyn.ios | grep -q "arm64"
          echo "✅ iOS mobile-shim app cross-compiles"

  cross-compile-android:
    name: Cross-compile (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build
        run: make clean && make
      - name: Cross-compile for Android
        run: |
          echo 'fn main() -> int { return 0 }' > /tmp/android.wyn
          ./wyn cross android /tmp/android.wyn && echo "✅ Android cross-compilation works" || echo "⚠️ Android NDK not available - skipped"
      - name: Cross-compile mobile-shim smoke app (counter-app shape)
        run: |
          cp tests/mobile/smoke_mobile_shim.wyn /tmp/shim.wyn
          ./wyn cross android /tmp/shim.wyn && echo "✅ Android mobile-shim app cross-compiles" || echo "⚠️ Android NDK not available - skipped"

  build-runtime-libs:
    name: Build runtime (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            cc: gcc
            arch_flags: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            arch_flags: ""
          - target: macos-arm64
            runner: macos-15
            cc: clang
            arch_flags: ""
          - target: macos-x64
            runner: macos-15-intel
            cc: clang
            arch_flags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build runtime library
        run: |
          make runtime
          cp runtime/libwyn_rt.a runtime/libwyn_rt_${{ matrix.target }}.a
          echo "✅ Built libwyn_rt_${{ matrix.target }}.a"
          nm runtime/libwyn_rt_${{ matrix.target }}.a | grep " T " | wc -l | xargs echo "Symbols:"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwyn_rt_${{ matrix.target }}
          path: runtime/libwyn_rt_${{ matrix.target }}.a
